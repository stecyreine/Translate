[package]
name = "live-interpretation"
version = "1.0.0"
description = "Système d'interprétation audio en direct"
authors = ["DevImpact"]
edition = "2021"
rust-version = "1.60"
publish = false

[build-dependencies]
tauri-build = { version = "1.5.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5.0", features = [ "process-relaunch", "shell-execute", "fs-all", "path-all", "shell-open", "process-exit", "shell-sidecar"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "live-interpretation"
path = "src/main.rs"
